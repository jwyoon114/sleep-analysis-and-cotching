name: Daljam mobile build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build target
        type: choice
        default: both
        options: [both, android, ios]
permissions:
  contents: read
jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build Galaxy test APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Daljam-Android-test-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode project
        working-directory: mobile/ios
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Compile iPhone app for simulator
        working-directory: mobile/ios
        run: xcodebuild -project Daljam.xcodeproj -scheme Daljam -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Daljam-iOS-simulator-validation-only
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/Daljam.app
          retention-days: 7
