name: Daljam
options:
  bundleIdPrefix: app.daljam
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Daljam:
    type: application
    platform: iOS
    sources:
      - path: Daljam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.daljam.mobile
        INFOPLIST_FILE: Daljam/Info.plist
        CODE_SIGN_ENTITLEMENTS: Daljam/Daljam.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
