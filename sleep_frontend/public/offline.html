<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7861ac">
  <title>달잠 · 연결 확인</title>
  <style>body{font-family:system-ui,sans-serif;background:#f8f8fb;color:#383044;margin:0;padding:36px;line-height:1.8}main{max-width:420px;margin:15vh auto}button{background:#7861ac;color:white;padding:14px 24px;border:0;border-radius:12px;font-size:16px}p{color:#746b80}</style>
</head>
<body>
  <main>
    <h1>잠시 연결이 끊겼어요</h1>
    <p>인터넷 연결을 확인한 뒤 다시 연결해 주세요. 기록 조회와 분석은 달잠 서버에 연결되면 이용할 수 있어요.</p>
    <p>개인 수면 기록과 로그인 정보는 오프라인 캐시에 저장되지 않습니다.</p>
    <button type="button" onclick="location.reload()">다시 연결</button>
  </main>
</body>
</html>
